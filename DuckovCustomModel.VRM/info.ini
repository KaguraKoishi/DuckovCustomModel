name = DuckovCustomModel.VRM
displayName = Duckov Custom Model VRM
description = VRM extension for Duckov Custom Model.\n\nDrop .vrm files into ModConfigs/DuckovCustomModel.VRM/VRM and they appear in the Duckov Custom Model list with runtime loading, MToon (URP Deferred) rendering, SpringBone physics, equipment anchors and an in-game anchor tuning panel (F9).\n\nRequires the Duckov Custom Model base mod.
